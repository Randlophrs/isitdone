[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isitdone"
version = "0.1.0"
description = "Local-first periodic checklist (daily/weekly/monthly routines)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
isitdone = "launcher:main"

[tool.setuptools]
py-modules = ["launcher"]
